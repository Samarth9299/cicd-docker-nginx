# Nginx reverse proxy for the EC2 host (Ubuntu).
# scripts/setup-ec2.sh installs this as /etc/nginx/sites-available/app
# and replaces __SERVER_NAME__ with your domain (or "_" if you have none).
#
# SSL: when a domain is given, setup-ec2.sh runs
#   certbot --nginx -d <domain> --redirect
# which adds the 443/ssl server block, the Let's Encrypt certificate and the
# HTTP -> HTTPS redirect to this file automatically (and renews it).

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        # The app container only listens on 127.0.0.1:8000,
        # so Nginx is the only public entry point.
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
