# Local test of the full stack: Nginx reverse proxy -> Flask app container.
#   docker compose up --build
#   open http://localhost:8080
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
        GIT_SHA: local
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
